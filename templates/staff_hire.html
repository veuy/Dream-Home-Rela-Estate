<!DOCTYPE html>
<html>
<head>
    <title>Staff Hiring - Dream Home Real Estate</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
        h1 { color: #2c3e50; }
        form { background: white; padding: 20px; border-radius: 8px; max-width: 400px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 20px; border: 2px solid black; background: #eee; cursor: pointer; }
        .message { padding: 10px; margin-top: 15px; background: #dff0d8; border: 1px solid #3c763d; }
        table { border-collapse: collapse; margin-top: 30px; width: 100%; max-width: 700px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #2c3e50; color: white; }
    </style>
</head>
<body>
    <h1>Staff Hiring</h1>
    <a href="/">&larr; Back to Main Menu</a>

    <form method="POST" action="/staff/hire">
        <label>Staff No</label>
        <input type="text" name="staffno" required>

        <label>First Name</label>
        <input type="text" name="fname" required>

        <label>Last Name</label>
        <input type="text" name="lname" required>

        <label>Position</label>
        <input type="text" name="position" required>

        <label>Sex</label>
        <select name="sex">
            <option value="M">M</option>
            <option value="F">F</option>
        </select>

        <label>Date of Birth</label>
        <input type="date" name="dob" required>

        <label>Salary</label>
        <input type="number" name="salary" required>

        <label>Branch No</label>
        <input type="text" name="branchno" required>

        <label>Telephone</label>
        <input type="text" name="telephone">

        <button type="submit">Hiring</button>
    </form>

    {% if message %}
    <div class="message">{{ message }}</div>
    {% endif %}

    <h2>Current Staff</h2>
    <table>
        <tr>
            <th>Staff No</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Position</th>
            <th>Branch No</th>
        </tr>
        {% for row in staff_list %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
            <td>{{ row[4] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
