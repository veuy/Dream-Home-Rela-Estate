<!DOCTYPE html>
<html>
<head>
    <title>Update Branch - Dream Home Real Estate</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
        h1 { color: #2c3e50; }
        table { border-collapse: collapse; margin-top: 20px; width: 100%; max-width: 800px; background: white; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #2c3e50; color: white; }
        input { width: 140px; padding: 4px; }
        button { padding: 5px 12px; border: 2px solid black; background: #eee; cursor: pointer; }
        .message { padding: 10px; margin-top: 15px; background: #dff0d8; border: 1px solid #3c763d; max-width: 800px; }
    </style>
</head>
<body>
    <h1>Update Branch</h1>
    <a href="/">&larr; Back to Main Menu</a>

    {% if message %}
    <div class="message">{{ message }}</div>
    {% endif %}

    <p>Edit Street, City, or Postcode and click Save. Branch No cannot be changed.</p>

    <table>
        <tr>
            <th>Branch No</th>
            <th>Street</th>
            <th>City</th>
            <th>Postcode</th>
            <th></th>
        </tr>
        {% for row in branch_list %}
        <tr>
            <td>{{ row[0] }}</td>
            <td><input type="text" name="street" form="form_{{ row[0] }}" value="{{ row[1] or '' }}"></td>
            <td><input type="text" name="city" form="form_{{ row[0] }}" value="{{ row[2] or '' }}"></td>
            <td><input type="text" name="postcode" form="form_{{ row[0] }}" value="{{ row[3] or '' }}"></td>
            <td><button type="submit" form="form_{{ row[0] }}">Save</button></td>
        </tr>
        {% endfor %}
    </table>

    {% for row in branch_list %}
    <form id="form_{{ row[0] }}" method="POST" action="/branch/update/{{ row[0] }}"></form>
    {% endfor %}
</body>
</html>
