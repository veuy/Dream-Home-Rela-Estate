<!DOCTYPE html>
<html>
<head>
    <title>Register Client - Dream Home Real Estate</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
        h1 { color: #2c3e50; }
        form { background: white; padding: 20px; border-radius: 8px; max-width: 400px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 20px; border: 2px solid black; background: #eee; cursor: pointer; }
        .message { padding: 10px; margin-top: 15px; background: #dff0d8; border: 1px solid #3c763d; max-width: 400px; }
        table { border-collapse: collapse; margin-top: 30px; width: 100%; max-width: 900px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #2c3e50; color: white; }
    </style>
</head>
<body>
    <h1>Register New Client</h1>
    <a href="/">&larr; Back to Main Menu</a>

    <form method="POST" action="/client/register">
        <label>Client No</label>
        <input type="text" name="clientno" required>

        <label>First Name</label>
        <input type="text" name="fname" required>

        <label>Last Name</label>
        <input type="text" name="lname" required>

        <label>Telephone</label>
        <input type="text" name="telno" required>

        <label>Street</label>
        <input type="text" name="street">

        <label>City</label>
        <input type="text" name="city">

        <label>Email</label>
        <input type="email" name="email">

        <label>Preferred Type</label>
        <select name="preftype">
            <option value="Flat">Flat</option>
            <option value="House">House</option>
        </select>

        <label>Max Rent</label>
        <input type="number" name="maxrent" step="0.01">

        <button type="submit">Register</button>
    </form>

    {% if message %}
    <div class="message">{{ message }}</div>
    {% endif %}

    <h2>Current Clients</h2>
    <table>
        <tr>
            <th>Client No</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Telephone</th>
            <th>City</th>
            <th>Pref Type</th>
            <th>Max Rent</th>
        </tr>
        {% for row in client_list %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
            <td>{{ row[5] }}</td>
            <td>{{ row[7] }}</td>
            <td>{{ row[8] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
