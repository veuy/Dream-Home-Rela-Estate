<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branch Address Lookup - Dream Home Real Estate</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="/">
                <span class="brand-mark">DH</span>
                <span>Dream Home Real Estate</span>
            </a>
            <nav class="main-nav">
                <div class="nav-group">
                    <span class="nav-label">Staff</span>
                    <a href="/staff/hire">Hire</a>
                    <a href="/staff/list">List / Update</a>
                </div>
                <div class="nav-group">
                    <span class="nav-label">Branch</span>
                    <a href="/branch/address" class="active">Address</a>
                    <a href="/branch/list">List / Update</a>
                    <a href="/branch/new">New Branch</a>
                </div>
                <div class="nav-group">
                    <span class="nav-label">Client</span>
                    <a href="/client/register">Register</a>
                    <a href="/client/list">List / Update</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="page-head">
            <h1 class="page-title">Branch Address Lookup</h1>
            <p class="page-subtitle">Find a branch's street address and city.</p>
        </div>

        <form class="form-card" method="POST" action="/branch/address">
            <label>Branch No</label>
            <input type="text" name="branchno" value="{{ searched_branchno or '' }}" required>
            <button class="btn btn-gold" type="submit">Look Up</button>
        </form>

        {% if address %}
        <div class="result">Address: {{ address }}</div>
        {% endif %}
    </main>

    <footer class="page-footer">
        &copy; Dream Home Real Estate &mdash; Internal Admin Tool
    </footer>
</body>
</html>
