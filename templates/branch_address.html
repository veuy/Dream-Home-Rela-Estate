<!DOCTYPE html>
<html>
<head>
    <title>Branch Address Lookup - Dream Home Real Estate</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
        h1 { color: #2c3e50; }
        form { background: white; padding: 20px; border-radius: 8px; max-width: 400px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 20px; border: 2px solid black; background: #eee; cursor: pointer; }
        .result { padding: 12px; margin-top: 15px; background: #dff0d8; border: 1px solid #3c763d; max-width: 400px; font-size: 18px; }
    </style>
</head>
<body>
    <h1>Branch Address Lookup</h1>
    <a href="/">&larr; Back to Main Menu</a>

    <form method="POST" action="/branch/address">
        <label>Branch No</label>
        <input type="text" name="branchno" value="{{ searched_branchno or '' }}" required>
        <button type="submit">Look Up</button>
    </form>

    {% if address %}
    <div class="result">Address: {{ address }}</div>
    {% endif %}
</body>
</html>
